name = "brewer-push"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"] # Roda a cada 15 min para verificar se há janelas livres ou horários agendados

[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "brewer_subscriptions"
